<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visor de Pensum - Sigma</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/index.css">
</head>
<body>

  <nav class="navbar navbar-dark bg-primary mb-4 shadow-sm">
    <div class="container">
      <span class="navbar-brand fw-bold">SIGMA — Consulta de Pensum</span>
    </div>
  </nav>

  <div class="container pb-5">
    <div class="card shadow-sm mb-4">
      <div class="card-body">
        <label for="selectCarrera" class="form-label fw-semibold">Selecciona una Carrera:</label>
        <div class="d-flex gap-2">
          <select id="selectCarrera" class="form-select">
            <option value="">Cargando carreras...</option>
          </select>
          <button id="btnConsultar" class="btn btn-primary px-4">Ver</button>
        </div>
        <div id="alerta" class="alert alert-danger mt-3 d-none"></div>
      </div>
    </div>

    <div id="contenedorPensum"></div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/pensum.js"></script>
</body>
</html>
