<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prueba API Sigma</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light p-4">
  <div class="container">
    <h4 class="mb-3 text-primary">Prueba de Conexión JSON</h4>
    <button id="btnProbar" class="btn btn-success w-100 mb-3">Consultar API Laravel</button>
    <div id="estado" class="alert alert-secondary">Esperando consulta...</div>
    <ul id="listaDatos" class="list-group"></ul>
  </div>

  <script>
    const API_URL = "http://192.168.11.48:8000/api/prueba";

    document.getElementById("btnProbar").addEventListener("click", async () => {
      const estado = document.getElementById("estado");
      const lista = document.getElementById("listaDatos");
      estado.className = "alert alert-info";
      estado.textContent = "Conectando con Laravel...";
      lista.innerHTML = "";

      try {
        const res = await fetch(API_URL, { headers: { "Accept": "application/json" } });
        const json = await res.json();
        estado.className = "alert alert-success";
        estado.textContent = json.mensaje + " (" + json.fecha + ")";
        json.datos.forEach(item => {
          lista.innerHTML += `<li class="list-group-item">${item.id} - ${item.nombre}</li>`;
        });
      } catch (error) {
        estado.className = "alert alert-danger";
        estado.textContent = "Error de conexión: " + error.message;
      }
    });
  </script>
</body>
</html>
