name: Generar APK Android
on:
  push:
    branches: [ adrian-backend ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar dependencias y sincronizar Capacitor
        working-directory: ./sigma-app
        run: |
          npm install
          npx cap sync android

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Compilar APK Debug
        working-directory: ./sigma-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: sigma-app-debug
          path: sigma-app/android/app/build/outputs/apk/debug/app-debug.apk