name: Generar APK Android
on:
  push:
    branches: [ adrian-backend ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./sigma-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npx cap sync android
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - run: chmod +x android/gradlew
      - run: ./android/gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: sigma-app-debug
          path: sigma-app/android/app/build/outputs/apk/debug/app-debug.apk